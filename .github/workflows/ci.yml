name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never run against real Supabase/Upstash -- every job below uses local
# placeholders or an ephemeral service-container Postgres only, matching the
# project's "no implicit .env / no live credentials in automated runs" rule
# (see docs/TESTING.md, docs/SECURITY.md).
env:
  DATABASE_URL: postgresql://user:pass@localhost:5432/db
  DIRECT_URL: postgresql://user:pass@localhost:5432/db
  REDIS_URL: redis://localhost:6379

jobs:
  backend:
    name: Backend (lint, typecheck, test, build, prisma check)
    runs-on: ubuntu-latest
    # Ephemeral, local to this CI run only -- not Supabase, not shared with
    # anything. Needed for the Prisma drift check below: verifying a
    # multi-migration history against schema.prisma correctly (not just
    # "does the SQL text match") requires Prisma to replay the migrations
    # against a real (even if throwaway) Postgres shadow database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma_ci
          POSTGRES_PASSWORD: prisma_ci
          POSTGRES_DB: prisma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
      - name: Prisma schema/migration drift check
        run: npm run prisma:check
        env:
          DATABASE_URL: postgresql://prisma_ci:prisma_ci@localhost:5432/prisma_ci
          DIRECT_URL: postgresql://prisma_ci:prisma_ci@localhost:5432/prisma_ci
          SHADOW_DATABASE_URL: postgresql://prisma_ci:prisma_ci@localhost:5432/prisma_ci_shadow

  ai:
    name: AI service (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/ai/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
        env:
          AI_DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AI_DIRECT_URL: postgresql://user:pass@localhost:5432/db

  python-services:
    name: Python services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [search, extractor, validator]
    defaults:
      run:
        working-directory: apps/python/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q
