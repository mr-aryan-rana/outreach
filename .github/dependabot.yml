version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/apps/python/search"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/python/extractor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/python/validator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
