<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Outreach Dashboard{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
    header { padding: 16px 24px; background: #171a21; border-bottom: 1px solid #2a2e37; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { background: #171a21; border: 1px solid #2a2e37; border-radius: 8px; padding: 16px; }
    .card .value { font-size: 28px; font-weight: 700; }
    .card .label { font-size: 12px; color: #9aa0aa; text-transform: uppercase; letter-spacing: .04em; }
    .panel { background: #171a21; border: 1px solid #2a2e37; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .panel h2 { margin-top: 0; font-size: 15px; color: #cfd3da; }
    form { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 12px; color: #9aa0aa; }
    input, textarea, select { background: #0f1115; border: 1px solid #2a2e37; color: #e6e6e6; border-radius: 6px; padding: 8px; font-family: inherit; }
    textarea { min-height: 80px; }
    button { background: #3b6fe0; color: white; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; align-self: flex-start; }
    button:hover { background: #2f5bc0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2e37; }
    th { color: #9aa0aa; font-weight: 600; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.valid { background: #14351f; color: #5fd68a; }
    .badge.invalid { background: #3a1a1a; color: #ef7a7a; }
    .badge.sent { background: #17304a; color: #6fb3f0; }
    .badge.pending { background: #35301a; color: #e0c25f; }
    .badge.failed { background: #3a1a1a; color: #ef7a7a; }
    .tabs a { color: #9aa0aa; text-decoration: none; margin-right: 16px; font-size: 13px; }
    .tabs a.active { color: #e6e6e6; font-weight: 600; border-bottom: 2px solid #3b6fe0; padding-bottom: 4px; }
    .msg { background: #14351f; color: #5fd68a; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .progress { height: 8px; background: #0f1115; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar { height: 100%; background: #3b6fe0; }
  </style>
</head>
<body>
  <header>
    <h1>Outreach Monolith</h1>
    <div class="tabs">
      <a href="/dashboard" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
      <a href="/dashboard/emails" class="{{ 'active' if active == 'emails' else '' }}">Emails</a>
      <a href="/dashboard/campaigns" class="{{ 'active' if active == 'campaigns' else '' }}">Campaigns</a>
    </div>
  </header>
  <main>
    {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
